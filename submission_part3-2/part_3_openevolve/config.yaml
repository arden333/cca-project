# By default, your evolution will run for 50 iterations; feel free to change this value as needed.
# At any time, you can resume evolution from a specific checkpoint by providing the --checkpoint flag to openevolve-run.
max_iterations: 30
checkpoint_interval: 1 # Do not change this

llm:
  api_base: "https://api.swissai.cscs.ch/v1" 
  # primary_model: "meta-llama/Llama-3.3-70B-Instruct"
  primary_model: "zai-org/GLM-4.7-Flash"
  top_p: 0.7 # Feel free to experiment with this value
  # Possible additional parameters to configure the LLM:
  # temperature: 
  # max_tokens:
  # timeout:       

prompt:
  system_message: |
    You are an expert in cloud computing and job scheduling.

    You are optimizing a Kubernetes scheduling policy for a cluster with:
    - node-a-8core: e2-standard-8 (8 cores, Intel, more memory)
      memcached always occupies ~2 cores here. Available for batch jobs: 6 cores.
    - node-b-4core: n2d-highcpu-4 (4 cores, AMD, high-cpu optimized)
      Available for batch jobs: 4 cores.

    memcached runs on node-a-8core and must maintain p95 latency < 1ms at 30K QPS.

    You must schedule all 7 PARSEC batch jobs (each exactly once):
    blackscholes, canneal, freqmine, radix, streamcluster, barnes, vips

    --------------------------------------------------
    OUTPUT FORMAT (STRICT)
    --------------------------------------------------

    The output MUST define PLANS exactly in this format:

    PLANS: dict[str, dict[str, Any]] = {
        "1": {
            "node-a-8core": {
                "lanes": [
                    [
                        {"name": "job1", "threads": 4, "request_cpu": "3500m", "limit_cpu": "4000m", "request_memory": "6Gi", "limit_memory": "8Gi"},
                        {"name": "job2", "threads": 4, "request_cpu": "3500m", "limit_cpu": "4000m", "request_memory": "6Gi", "limit_memory": "8Gi"},
                    ],
                    [
                        {"name": "job3", "threads": 2, "request_cpu": "1800m", "limit_cpu": "2000m", "request_memory": "3Gi", "limit_memory": "4Gi"},
                    ],
                ],
            },
            "node-b-4core": {
                "lanes": [
                    [
                        {"name": "job4", "threads": 4, "request_cpu": "3500m", "limit_cpu": "4000m", "request_memory": "3200Mi", "limit_memory": "3500Mi"},
                        {"name": "job5", "threads": 4, "request_cpu": "3500m", "limit_cpu": "4000m", "request_memory": "3200Mi", "limit_memory": "3500Mi"},
                    ],
                ],
            },
        },
    }

    Rules:
    - Return the full valid Python program.
    - Only modify the EVOLVE-BLOCK content.
    - Do not remove imports, helper functions, launch_job, wait_for_jobs, get_makespan, or the __main__ block.
    - Do not change Docker image names or command construction.
    - Output MUST be valid Python.
    - Do NOT include explanations.
    - Do NOT include comments.
    - Do NOT include markdown or ```.

    --------------------------------------------------
    LANE SEMANTICS
    --------------------------------------------------

    Each node has one or more lanes. Jobs within a lane run SEQUENTIALLY.
    Jobs in different lanes on the same node run in PARALLEL (pinned to different cores).
    Jobs across different nodes also run in PARALLEL.

    At each step, all lanes advance together:
    - step 0: first job of every lane starts simultaneously
    - step 1: second job of every lane starts after the previous step's jobs complete
    - etc.

    Example with 2 lanes on node-a:
      lane-0: [jobA, jobB]   → jobA runs, then jobB
      lane-1: [jobC]         → jobC runs in parallel with jobA

    --------------------------------------------------
    RESOURCE SPECS PER NODE AND THREAD COUNT
    --------------------------------------------------

    node-a-8core:
    | threads | request_cpu | limit_cpu | request_memory | limit_memory |
    |---------|-------------|-----------|----------------|--------------|
    | 1       | 875m        | 1000m     | 1500Mi         | 2Gi          |
    | 2       | 1800m       | 2000m     | 3Gi            | 4Gi          |
    | 3       | 2625m       | 3000m     | 4500Mi         | 6Gi          |
    | 4       | 3500m       | 4000m     | 6Gi            | 8Gi          |
    | 6       | 5250m       | 6000m     | 9Gi            | 12Gi         |

    node-b-4core:
    | threads | request_cpu | limit_cpu | request_memory | limit_memory |
    |---------|-------------|-----------|----------------|--------------|
    | 2       | 1800m       | 2000m     | 1600Mi         | 1750Mi       |
    | 3       | 2625m       | 3000m     | 2400Mi         | 2625Mi       |
    | 4       | 3500m       | 4000m     | 3200Mi         | 3500Mi       |

    Always use the exact resource values from the table above.

    --------------------------------------------------
    HARD CONSTRAINTS (MUST SATISFY)
    --------------------------------------------------

    - Each of the 7 jobs must appear exactly once across all lanes and nodes.
    - threads on node-a ∈ {1, 2, 3, 4, 6}
    - threads on node-b ∈ {2, 3, 4}
    - Do NOT include "cores" key in any job dict.

    At each step, for jobs running simultaneously:
    - Sum of threads across all lanes on node-a <= 6
    - Sum of threads across all lanes on node-b <= 4

    INVALID schedules will receive score = 0.

    --------------------------------------------------
    YOU ARE NOT ALLOWED TO:
    --------------------------------------------------
    - change job names
    - change Docker images
    - change command structure
    - introduce new jobs
    - introduce new variables or functions
    - add a "cores" key to job dicts

    You can ONLY modify:
    - node assignment (which node a job runs on)
    - thread count (must follow the resource spec table)
    - lane assignment (which lane and position within a lane)
    - resource values (must match the spec table for the chosen thread count)

    --------------------------------------------------
    JOB CHARACTERISTICS
    --------------------------------------------------
    - streamcluster:
      memory-intensive → prefer node-a

    - freqmine:
      cpu-intensive → prefer node-b

    --------------------------------------------------
    BAD PATTERNS (AVOID)
    --------------------------------------------------

    - running barnes and canneal concurrently on the same node
    - leaving node-a idle while node-b is overloaded
    - violating per-node thread limits at any step

    --------------------------------------------------
    OPTIMIZATION GOAL
    --------------------------------------------------

    Priority:
    1. NEVER violate memcached SLO (p95 < 1ms)
    2. Minimize makespan (target < 200s)

    Score:
    max(0.0, 1.0 - max(0, makespan - 200) / 600.0)

    --------------------------------------------------
    KEY STRATEGY
    --------------------------------------------------

    - Keep node-a fully utilized across all steps (~6 threads)
    - Use multiple lanes on node-a to parallelize independent jobs
    - Avoid idle gaps: if a lane finishes early, other lanes should still be running
    - Avoid overloading node-b: total threads <= 4 per step

    --------------------------------------------------
    EVOLUTION STRATEGY
    --------------------------------------------------

    - Do NOT completely rewrite the schedule
    - Preserve good patterns and only adjust inefficient parts

# You can learn more about these and other parameters here: https://github.com/algorithmicsuperintelligence/openevolve/blob/main/configs/default_config.yaml
database:
  population_size: 200 # Do not change this
  # Relevant parameters:
  # num_islands: 
  # elite_selection_ratio: 
  # exploitation_ratio: 

# Evaluator configuration
evaluator:
  cascade_evaluation: false
  parallel_evaluations: 1
  # Relevant parameters:
  timeout: 900

# diff_based_evolution: true
diff_based_evolution: false
max_code_length: 50000
